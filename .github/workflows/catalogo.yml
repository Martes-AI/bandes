name: Catalogo bandi

on:
  schedule:
    - cron: "15 5 * * *" # ogni giorno alle 6:15 ora italiana (inverno)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scarica i bandi aperti
        run: npm run catalogo
      - name: Salva il catalogo se è cambiato
        id: salva
        run: |
          if git diff --quiet public/catalogo.json; then
            echo "cambiato=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalogo.json
          git commit -m "Catalogo bandi del $(date -u +%Y-%m-%d)"
          git push
          echo "cambiato=si" >> "$GITHUB_OUTPUT"
      - name: Pubblica su Cloudflare
        if: steps.salva.outputs.cambiato == 'si' && env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
